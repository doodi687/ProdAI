# Render Blueprint - Multi-service deployment configuration
# This file defines both frontend and backend services for Render

services:
  # Backend API Service
  - type: web
    name: prodai-backend
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: FRONTEND_URL
        fromService:
          name: prodai-frontend
          type: web
          property: url
      - key: ENV
        value: production
    healthCheckPath: /health
    plan: free

  # Frontend Static Site
  - type: web
    name: prodai-frontend
    runtime: static
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: prodai-backend
          type: web
          property: url
    plan: free
